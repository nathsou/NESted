[workspace]
members = ["crates/emulator", "crates/compiler", "crates/runtime", "crates/cli", "crates/wasm", "crates/chessbench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nested-compiler = { path = "crates/compiler" }
nested-runtime = { path = "crates/runtime" }
nessy = { path = "crates/emulator" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

