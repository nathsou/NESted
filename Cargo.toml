[workspace]
members = ["crates/compiler", "crates/runtime", "crates/cli", "crates/wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nested-compiler = { path = "crates/compiler" }
nested-runtime = { path = "crates/runtime" }
nessy = { git = "https://github.com/nathsou/nessy", rev = "05cf17ca37fcded5856e80fbb9ebf10ede0bfad8" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

