name: Verify and deploy playground
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare Rust
        run: rustup target add wasm32-unknown-unknown
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Execute compiler and cartridge tests
        run: cargo test --release --workspace --locked
      - run: npm ci
      - name: Build native compiler and WASM playground
        run: npm run build
      - name: Verify WASM parity, music and native LSP
        run: npm test
      - name: Verify browser workbench
        env:
          CHROMIUM: google-chrome
        run: npm run test:browser
      - name: Package VS Code extension
        run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: nested-linux-x64
          path: |
            target/release/nested
            extension/dist/*.vsix
            artifacts/*.nes
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: playground/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
